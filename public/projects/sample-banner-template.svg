<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  <circle cx="950" cy="150" r="300" fill="url(#glow1)"/>
  <circle cx="150" cy="700" r="250" fill="url(#glow2)"/>

  <!-- dot grid texture -->
  <g opacity="0.15">
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff"/>
    </pattern>
    <rect width="1200" height="800" fill="url(#dots)"/>
  </g>

  <!-- Phone mockup -->
  <g transform="translate(430, 90)">
    <rect x="0" y="0" width="340" height="620" rx="42" fill="#0d0d14" stroke="#2a2a38" stroke-width="3"/>
    <rect x="10" y="10" width="320" height="600" rx="34" fill="url(#screenGrad)"/>
    <rect x="120" y="22" width="100" height="22" rx="11" fill="#0d0d14" opacity="0.6"/>

    <!-- mock UI elements inside screen -->
    <rect x="34" y="80" width="272" height="80" rx="16" fill="#ffffff" opacity="0.18"/>
    <rect x="34" y="180" width="130" height="100" rx="14" fill="#ffffff" opacity="0.22"/>
    <rect x="176" y="180" width="130" height="100" rx="14" fill="#ffffff" opacity="0.22"/>
    <rect x="34" y="300" width="272" height="14" rx="7" fill="#ffffff" opacity="0.3"/>
    <rect x="34" y="324" width="180" height="14" rx="7" fill="#ffffff" opacity="0.2"/>
    <rect x="34" y="370" width="272" height="180" rx="16" fill="#ffffff" opacity="0.15"/>
    <rect x="34" y="572" width="272" height="36" rx="18" fill="#0d0d14" opacity="0.35"/>
  </g>

  <!-- Text content -->
  <text x="80" y="140" font-family="Arial, sans-serif" font-size="22" fill="#22d3ee" font-weight="600" letter-spacing="2">PROJECT NAME</text>
  <text x="80" y="195" font-family="Arial, sans-serif" font-size="46" fill="#f4f4f6" font-weight="700">Your App Title</text>
  <text x="80" y="235" font-family="Arial, sans-serif" font-size="20" fill="#a1a1ae">Flutter &#8226; Firebase &#8226; GetX</text>

  <rect x="80" y="270" width="150" height="44" rx="22" fill="#6366f1" opacity="0.2" stroke="#6366f1" stroke-width="1.5"/>
  <text x="155" y="298" font-family="Arial, sans-serif" font-size="16" fill="#818cf8" text-anchor="middle" font-weight="600">Case Study</text>
</svg>
